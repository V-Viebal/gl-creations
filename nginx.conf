server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 32m;
  gzip on;
  gzip_types text/plain text/css application/javascript image/svg+xml;
  location / {
    try_files $uri $uri/ $uri/index.html =404;
  }
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
